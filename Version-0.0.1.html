<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コインアスレチック</title>
<style>
:root{box-sizing:border-box;--fg:#fff;--bg:#0b1020}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
canvas{display:block}
#hud{position:fixed;left:0;top:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;color:var(--fg);pointer-events:none;display:flex;justify-content:space-between;font-size:18px;font-weight:600;text-shadow:0 1px 4px #000}
#help{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 10px);color:var(--fg);font-size:13px;opacity:.85;text-align:center;text-shadow:0 1px 4px #000;pointer-events:none}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:var(--fg);background:rgba(0,0,0,.55);text-align:center;font-size:22px;gap:8px}
#msg b{font-size:34px}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;color:#fff;background:#300;text-align:center;font-size:18px;line-height:1.7;z-index:9}
</style>
</head>
<body>
<div id="hud"><span id="coins">コイン 0 / 0</span><span id="time">0.0 秒</span></div>
<div id="help">移動: WASD / 矢印キー　ジャンプ: スペース　カメラ: ドラッグ or Q・E　やり直し: R</div>
<div id="err"></div>
<div id="msg"><b>ゴール！</b><span id="res"></span><span>Rキーでもう一度</span></div>
<script>
window.__fail=function(m){var e=document.getElementById('err');if(e){e.textContent=m;e.style.display='flex'}};
window.addEventListener('error',function(ev){window.__fail('エラーが発生しました: '+(ev&&ev.message?ev.message:'不明')+'\n（F12 でコンソールを確認してください）')});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';s.onload=function(){if(window.__boot)window.__boot()};s.onerror=function(){window.__fail('three.js を読み込めませんでした。インターネット接続を確認してください。')};document.head.appendChild(s);"></script>
<script>
function boot(){
"use strict";
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,120);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,300);
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}
catch(e){window.__fail('WebGL が使えません。ブラウザのハードウェアアクセラレーション設定を確認してください。');return;}
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x556677,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.7);sun.position.set(10,30,20);scene.add(sun);

// sea below
const sea=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshLambertMaterial({color:0x2a6fb0}));
sea.rotation.x=-Math.PI/2;sea.position.y=-12;scene.add(sea);

// ---- level ----
const boxes=[],meshes=[],movers=[],coins=[];
function addBox(cx,cy,cz,w,h,d,color,move){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color,transparent:true}));
  m.position.set(cx,cy,cz);scene.add(m);meshes.push(m);
  const b={m,w,h,d,move,base:cx,min:{},max:{},dx:0};
  boxes.push(b);if(move)movers.push(b);
  updBounds(b);return b;
}
function updBounds(b){
  const p=b.m.position;
  b.min={x:p.x-b.w/2,y:p.y-b.h/2,z:p.z-b.d/2};
  b.max={x:p.x+b.w/2,y:p.y+b.h/2,z:p.z+b.d/2};
}
const cols=[0xe5734a,0x4aa3e5,0x6cc36a,0xe5c24a,0xb26ce5];
let ci=0;
function plat(x,top,z,w,d,move,coin=true){
  const b=addBox(x,top-0.5,z,w,1,d,cols[ci++%cols.length],move);
  if(coin)addCoin(x,top+1.2,z,move);
  return b;
}
function wall(x,z,w,d,y0,y1){addBox(x,(y0+y1)/2,z,w,y1-y0,d,0x888888);}
function addCoin(x,y,z,move){
  const c=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.12,20),new THREE.MeshLambertMaterial({color:0xffd23f,emissive:0x553300}));
  c.rotation.x=Math.PI/2;
  const g=new THREE.Group();g.add(c);g.position.set(x,y,z);scene.add(g);
  coins.push({g,c,got:false,move});
}
plat(0,0,0,8,8,null,false);
plat(0,0.5,-8,3,3);
plat(3,1.5,-12,3,3);
plat(0,2.5,-16,3,3);
plat(-4,2.5,-19,2.5,2.5);
const mv=plat(-4,2.5,-24,3,3,{amp:4,spd:1});
plat(0,3.5,-29,3,3);
plat(0,3.5,-35,1.2,6);
plat(0,4.5,-41,3,3);
plat(3,5.5,-45,3,3);
plat(6,6.5,-49,3,3);
plat(2,7.5,-53,3,3);
const goal=plat(0,8,-60,6,6,null,false);
const flag=new THREE.Mesh(new THREE.ConeGeometry(0.8,2.4,4),new THREE.MeshLambertMaterial({color:0xff3b6b}));
flag.position.set(0,9.3,-60);scene.add(flag);
// grey walls / pillars (camera sees through them)
wall(0,7.5,6,1,-12,8);
wall(-3.5,-14,1.5,1.5,-12,9);
wall(3,-33,1.5,1.5,-12,10);
wall(-3,-39,1.5,1.5,-12,10);
wall(5,-52,1.5,1.5,-12,14);
document.getElementById('coins').dataset.total=coins.length;

// ---- player ----
const R=0.4,H=1.0;
const pl=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.7,16),new THREE.MeshLambertMaterial({color:0xff5577}));
body.position.y=0.35;
const head=new THREE.Mesh(new THREE.SphereGeometry(0.32,16,12),new THREE.MeshLambertMaterial({color:0xffe0bd}));
head.position.y=0.85;
const nose=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.2),new THREE.MeshLambertMaterial({color:0x333333}));
nose.position.set(0,0.85,0.32);
pl.add(body,head,nose);scene.add(pl);
const pos=new THREE.Vector3(0,0.05,0),vel=new THREE.Vector3();
let onGround=false,stand=null,yaw=0,pitch=0.5,started=false,t=0,done=false,collected=0;
const DIST=9;

function reset(){
  pos.set(0,0.05,0);vel.set(0,0,0);yaw=0;pitch=0.5;started=false;t=0;done=false;collected=0;
  coins.forEach(c=>{c.got=false;c.g.visible=true});
  document.getElementById('msg').style.display='none';
}
// ---- input ----
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();if(e.code==='KeyR')reset()});
addEventListener('keyup',e=>keys[e.code]=false);
let drag=false,lx=0,ly=0;
addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
  if(!drag)return;
  yaw-=(e.clientX-lx)*0.006;
  pitch=Math.max(0.1,Math.min(1.3,pitch+(e.clientY-ly)*0.006));
  lx=e.clientX;ly=e.clientY;
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ---- physics ----
function overlaps(b,yLo,yHi){
  return pos.x+R>b.min.x&&pos.x-R<b.max.x&&pos.z+R>b.min.z&&pos.z-R<b.max.z&&pos.y+yHi>b.min.y&&pos.y+yLo<b.max.y;
}
function step(dt){
  // moving platforms
  for(const b of movers){
    const old=b.m.position.x;
    b.m.position.x=b.base+Math.sin(performance.now()/1000*b.move.spd)*b.move.amp;
    b.dx=b.m.position.x-old;updBounds(b);
    if(stand===b)pos.x+=b.dx;
  }
  let ix=0,iz=0;
  if(keys.KeyW||keys.ArrowUp)iz+=1;
  if(keys.KeyS||keys.ArrowDown)iz-=1;
  if(keys.KeyD||keys.ArrowRight)ix+=1;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;
  if(keys.KeyQ)yaw+=1.8*dt;
  if(keys.KeyE)yaw-=1.8*dt;
  const len=Math.hypot(ix,iz);
  let mx=0,mz=0;
  if(len){
    ix/=len;iz/=len;
    mx=ix*Math.cos(yaw)-iz*Math.sin(yaw);
    mz=-ix*Math.sin(yaw)-iz*Math.cos(yaw);
    pl.rotation.y=Math.atan2(mx,mz);
    started=true;
  }
  const sp=6;
  vel.x=mx*sp;vel.z=mz*sp;
  if(keys.Space&&onGround){vel.y=9;onGround=false;started=true}
  vel.y-=24*dt;

  pos.x+=vel.x*dt;
  for(const b of boxes)if(overlaps(b,0.02,H)){pos.x=vel.x>0?b.min.x-R:b.max.x+R}
  pos.z+=vel.z*dt;
  for(const b of boxes)if(overlaps(b,0.02,H)){pos.z=vel.z>0?b.min.z-R:b.max.z+R}
  pos.y+=vel.y*dt;
  onGround=false;stand=null;
  for(const b of boxes)if(overlaps(b,0,H)){
    if(vel.y<=0){pos.y=b.max.y;onGround=true;stand=b}
    else pos.y=b.min.y-H;
    vel.y=0;
  }
  if(pos.y<-12)reset();
}

// ---- camera with see-through ----
const ray=new THREE.Raycaster();
function updateCamera(){
  const cx=Math.sin(yaw)*Math.cos(pitch),cy=Math.sin(pitch),cz=Math.cos(yaw)*Math.cos(pitch);
  const target=new THREE.Vector3(pos.x,pos.y+0.9,pos.z);
  camera.position.set(target.x+cx*DIST,target.y+cy*DIST,target.z+cz*DIST);
  camera.lookAt(target);
  const dir=camera.position.clone().sub(target);
  const dist=dir.length();dir.normalize();
  ray.set(target,dir);ray.far=dist;
  const hit=new Set(ray.intersectObjects(meshes).map(h=>h.object));
  for(const m of meshes){
    const goal=hit.has(m)?0.2:1;
    m.material.opacity+=(goal-m.material.opacity)*0.3;
  }
}

// ---- loop ----
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!done){
    step(dt);
    if(started)t+=dt;
    for(const c of coins){
      if(c.got)continue;
      const g=c.g.position;
      if(c.move)g.x=mv.m.position.x;
      c.g.rotation.y+=dt*3;
      if(Math.hypot(pos.x-g.x,pos.z-g.z)<0.9&&Math.abs(pos.y+0.5-g.y)<1.1){c.got=true;c.g.visible=false;collected++}
    }
    if(stand===goal){
      done=true;
      document.getElementById('res').textContent='コイン '+collected+' / '+coins.length+'　タイム '+t.toFixed(1)+' 秒';
      document.getElementById('msg').style.display='flex';
    }
  }
  flag.rotation.y+=dt*2;
  pl.position.copy(pos);
  updateCamera();
  document.getElementById('coins').textContent='コイン '+collected+' / '+coins.length;
  document.getElementById('time').textContent=t.toFixed(1)+' 秒';
  renderer.render(scene,camera);
}
loop();
}
if(window.THREE)boot();else window.__boot=boot;
</script>
</body>
</html>
